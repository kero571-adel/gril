<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إتمام الطلب والدفع | مشاوي الجمر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-stage" aria-hidden="true">
  <video class="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="videos/grill.mp4" type="video/mp4">
  </video>
  <div class="bg-shade"></div>
</div>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 2c.6 3-1.4 4.6-2.8 6.4C7.8 10.2 7 11.8 7 13.6 7 16.6 9.2 19 12 19s5-2.4 5-5.4c0-1.6-.6-3-1.6-4.2-.2 1-.8 1.8-1.6 2.2.4-3-.8-6-1.8-9.6zM12 22c-3.9 0-7-1.3-7-2.6h14c0 1.3-3.1 2.6-7 2.6z"/></svg>
      <span>مشاوي الجمر</span>
    </a>
    
    <nav class="nav__menu" id="navMenu">
      <a href="index.html">الرئيسية</a>
      <a href="menu.html">المنيو</a>
      <a href="about.html">عن المطعم</a>
    </nav>

    <div class="nav__actions">
      <!-- فراغ متوازن للحفاظ على هيكل الـ Navbar -->
    </div>
  </div>
</header>

<main>
  <div class="container">
    <div class="checkout-container">
      <h2 style="margin-bottom:1.5rem; color:#fff;">إتمام الطلب وتأكيد التوصيل</h2>
      
      <form id="checkoutForm">
        <div class="form-group">
          <label>الاسم الكريم</label>
          <input type="text" class="form-control" placeholder="مثال: فهد القحطاني" required>
        </div>

        <div class="form-group">
          <label>رقم الجوال (للتواصل عند الوصول)</label>
          <input type="tel" class="form-control" placeholder="05xxxxxxxx" dir="ltr" required>
        </div>

        <div class="form-group">
          <label>عنوان التوصيل (المدينة، الحي، الشارع)</label>
          <textarea class="form-control" rows="3" placeholder="الرياض، حي الياسمين..." required></textarea>
        </div>

        <div class="form-group">
          <label>طريقة الدفع المفضلة</label>
          <div class="payment-methods">
            <div class="payment-card selected">
              <input type="radio" name="payment" checked style="display:none;">
              <span style="font-weight:700; color:#fff;">Apple Pay / مدى</span>
            </div>
            <div class="payment-card">
              <input type="radio" name="payment" style="display:none;">
              <span style="font-weight:700; color:#fff;">بطاقة ائتمانية</span>
            </div>
            <div class="payment-card">
              <input type="radio" name="payment" style="display:none;">
              <span style="font-weight:700; color:#fff;">الدفع عند الاستلام</span>
            </div>
          </div>
        </div>

        <div style="background:var(--coal-3); padding:1.5rem; border-radius:12px; margin-bottom:2rem; border:1px solid var(--line);">
          <h4 style="margin-bottom:0.8rem; color:var(--saffron);">ملخص الطلب:</h4>
          <div id="checkoutItems" style="margin-bottom:1rem;"></div>
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:1.1rem; border-top:1px solid var(--line); padding-top:0.8rem;">
            <span>المجموع النهائي:</span>
            <span id="checkoutTotal" style="color:var(--saffron);">0 ر.س</span>
          </div>
        </div>

        <button type="submit" class="btn btn--primary" style="width:100%; padding:1rem; font-size:1.1rem;">تأكيد وإرسال الطلب الآن 🔥</button>
      </form>
    </div>
  </div>
</main>

<footer class="footer" style="margin-top:4rem;">
  <div class="container footer__bottom">
    <p>© <span id="year"></span> مشاوي الجمر. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
