<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تواصل معنا | مشاوي الجمر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-stage" aria-hidden="true">
  <video class="bg-video" autoplay loop muted playsinline preload="auto">
    <source src="videos/grill.mp4" type="video/mp4">
  </video>
  <div class="bg-shade"></div>
</div>

<header class="nav" id="nav">
  <div class="nav__inner">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M12 2c.6 3-1.4 4.6-2.8 6.4C7.8 10.2 7 11.8 7 13.6 7 16.6 9.2 19 12 19s5-2.4 5-5.4c0-1.6-.6-3-1.6-4.2-.2 1-.8 1.8-1.6 2.2.4-3-.8-6-1.8-9.6zM12 22c-3.9 0-7-1.3-7-2.6h14c0 1.3-3.1 2.6-7 2.6z"/></svg>
      <span>مشاوي الجمر</span>
    </a>
    
    <nav class="nav__menu" id="navMenu">
      <a href="index.html">الرئيسية</a>
      <a href="menu.html">المنيو</a>
      <a href="about.html">عن المطعم</a>
      <a href="contact.html" class="active">تواصل معنا</a>
    </nav>

    <div class="nav__actions">
      <button class="cart-btn" id="cartBtn">
        <span>🛒</span>
        <span class="cart-text">السلة</span>
        <span class="cart-count">0</span>
      </button>
      <button class="nav__toggle" id="navToggle"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main class="container">
  <div class="checkout-container" style="margin-top: calc(var(--nav-h) + 2rem);">
    <h2 style="margin-bottom:1rem; color:#fff;">يسعدنا سماع صوتك أو تواصلك</h2>
    <p style="color:var(--muted); margin-bottom:2rem;">عندك استفسار، عزيمة خاصة، أو اقتراح؟ تواصل معنا وحنا حاضرين.</p>
    
    <form onsubmit="event.preventDefault(); alert('تم إرسال رسالتك بنجاح، سنتواصل معك قريباً!');">
      <div class="form-group">
        <label>الاسم</label>
        <input type="text" class="form-control" placeholder="اسمك الكريم" required>
      </div>
      <div class="form-group">
        <label>رقم الجوال أو البريد</label>
        <input type="text" class="form-control" placeholder="وسيلة الاتصال بك" required>
      </div>
      <div class="form-group">
        <label>رسالتك</label>
        <textarea class="form-control" rows="4" placeholder="اكتب استفسارك هنا..." required></textarea>
      </div>
      <button type="submit" class="btn btn--primary" style="width:100%;">إرسال الرسالة</button>
    </form>
  </div>
</main>

<!-- دراور السلة -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 style="color:#fff;">سلة مشترياتك</h3>
    <button id="closeCart" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">✕</button>
  </div>
  <div class="cart-body" id="cartItemsContainer"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>المجموع الكلي:</span>
      <span id="cartTotalPrice" style="color:var(--saffron);">0 ر.س</span>
    </div>
    <a href="checkout.html" class="btn btn--primary" style="width:100%;">إتمام الطلب والدفع</a>
  </div>
</div>

<footer class="footer" style="margin-top:4rem;">
  <div class="container footer__bottom">
    <p>© <span id="year"></span> مشاوي الجمر. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
